# Gera a snake do perfil QAGarcia
# Gera a animação da cobrinha comendo o gráfico de contribuições, 1x por dia.
name: Gerar snake

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia, meia-noite em São Paulo
  workflow_dispatch:       # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00DF3F&color_dots=#ebedf0,#a8efbd,#4fd97a,#00b834,#007a22
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00DF3F&color_dots=#161b22,#00331A,#00662A,#00A335,#00DF3F

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
